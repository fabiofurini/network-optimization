# mkdocs.yml (English): generated by python/genera_sito.py from python/mkdocs_modello_en.yml (LINGUA=en).
# Do not edit mkdocs.yml by hand.
site_name: Network Optimization · Fabio Furini
site_url: https://fabiofurini.github.io/network-optimization/
site_description: >-
  Lecture notes on network optimization: graphs, minimum spanning trees, shortest paths, network flows (maximum flow, minimum cost flow, transportation and assignment), the network simplex and project management, with worked examples and exercises.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/network-optimization
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/network-optimization/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/graph-outline
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: en

extra:
  social:
    - icon: material/web
      link: https://fabiofurini.github.io/
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab
    - icon: material/vector-triangle
      link: https://fabiofurini.github.io/linear-programming/
      name: Linear Programming
    - icon: material/vector-polygon
      link: https://fabiofurini.github.io/mip-modelling/
      name: MIP Modelling
    - icon: material/vector-polyline
      link: https://fabiofurini.github.io/integer-linear-programming/
      name: Integer Linear Programming
    - icon: material/math-integral
      link: https://fabiofurini.github.io/mathematical-analysis-1/
      name: Mathematical Analysis 1
    - icon: material/matrix
      link: https://fabiofurini.github.io/linear-algebra/
      name: Linear Algebra
    - icon: material/chart-bell-curve
      link: https://fabiofurini.github.io/convex-optimization/
      name: Convex Optimization
    - icon: material/code-braces
      link: https://fabiofurini.github.io/algorithms/
      name: Algorithms
    - icon: material/puzzle-outline
      link: https://fabiofurini.github.io/combinatorial-optimization/
      name: Combinatorial Optimization
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/ottimizzazione-su-reti/
      lang: it

extra_css:
  - stylesheets/extra.css?v=a25c6f8414
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraph.css
  - stylesheets/interattivi.css?v=c51ac2286b

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/cloudflare-analytics.js?v=bff73345a1
  - javascripts/mathjax.js?v=ea7087387b
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  # grafici interattivi: JSXGraph, il motore, poi le ricette (gi-*.js, le aggiunge genera_sito.py)
  - https://cdn.jsdelivr.net/npm/jsxgraph@1.10.1/distrib/jsxgraphcore.js
  - javascripts/interattivi.js?v=2687ca69e3
  - javascripts/gi-comune.js?v=40df75e3e5
  - javascripts/gi-no-0.js?v=da165c7941
  - javascripts/gi-no-a.js?v=c95bdb2f54
  - javascripts/gi-no-b.js?v=1c9a68cd3c


nav:
  - Home: index.md
  - Graphs:
      - graphs/index.md
      - "1. Graphs":
          - graphs/graphs/index.md
          - "Undirected and directed graphs": graphs/graphs/undirected-and-directed-graphs.md
          - "Representations of a graph": graphs/graphs/representations-of-a-graph.md
          - "Connectivity": graphs/graphs/connectivity.md
          - "Trees and forests": graphs/graphs/trees-and-forests.md
          - "The rank of the incidence matrix": graphs/graphs/the-rank-of-the-incidence-matrix.md
          - "Graph search": graphs/graphs/graph-search.md
  - Trees and paths:
      - trees-and-paths/index.md
      - "2. Spanning trees": trees-and-paths/minimum-spanning-trees.md
      - "3. Shortest paths": trees-and-paths/shortest-paths.md
  - Flows:
      - flows/index.md
      - "4. Flow models": flows/network-flow-models.md
  - Exercises:
      - exercises/index.md
      - "Graphs":
          - "1. Graphs": exercises/graphs.md
      - "Trees and paths":
          - "2. Spanning trees": exercises/minimum-spanning-trees.md
          - "3. Shortest paths": exercises/shortest-paths.md
      - "Flows":
          - "4. Flow models": exercises/network-flow-models.md
  - Lab: lab/index.md
  - Downloads: downloads.md
  - Index: full-index.md
